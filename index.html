<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MTR EAL Next Train Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <div class="glow"></div>
    <header>
      <div class="top-left">
        <h1 class="title">Next</h1>
      </div>
      <div class="top-right">
        <span id="last-update" class="pill" aria-label="列車資料來源時間">--:--:--</span>
        <span id="countdown-pill" class="pill"><span id="countdown">15</span>s</span>
        <span class="toggle-group" role="group" aria-label="顯示班次數量">
          <button class="toggle-btn" data-count="1">1</button>
          <button class="toggle-btn" data-count="2">2</button>
          <button class="toggle-btn" data-count="3">3</button>
          <button class="toggle-btn active" data-count="4">4</button>
          <span class="toggle-suffix">班</span>
        </span>
        <button id="refresh" class="btn" title="刷新" aria-label="刷新">↻</button>
      </div>
    </header>

    <div class="line-tabs" role="group" aria-label="路線">
      <button class="line-tab active" data-line="EAL" style="--tab-color:#53B7E8;">東鐵</button>
      <button class="line-tab" data-line="TML" style="--tab-color:#9A3A2B;">屯馬</button>
      <button class="line-tab" data-line="KTL" style="--tab-color:#00A551;">觀塘</button>
      <button class="line-tab" data-line="TWL" style="--tab-color:#E60012;">荃灣</button>
      <button class="line-tab" data-line="ISL" style="--tab-color:#0072CE;">港島</button>
      <button class="line-tab" data-line="TKL" style="--tab-color:#7D3C98;">將軍澳</button>
      <button class="line-tab" data-line="TCL" style="--tab-color:#F47B20;">東涌</button>
      <button class="line-tab" data-line="SIL" style="--tab-color:#B5BD00;">南港島</button>
      <button class="line-tab" data-line="AEL" style="--tab-color:#00888A;">機鐵</button>
      <button class="line-tab" data-line="DRL" style="--tab-color:#E4007F;">迪士尼</button>
      <button class="line-tab" data-line="XFR" style="--tab-color:#f5b700;">轉車</button>
    </div>

    <section class="favorites-panel" aria-label="常用車站">
      <div class="favorites-head">
        <strong>常用車站</strong>
        <button id="favorites-full" type="button" aria-pressed="true">完整路線</button>
      </div>
      <div id="favorites-shortcuts" class="favorites-shortcuts"></div>
      <p id="favorites-message" role="status" aria-live="polite"></p>
      <details id="favorites-editor">
        <summary>新增常用車站</summary>
        <form id="favorites-form">
          <label>路線<select id="favorite-line" required></select></label>
          <label>車站<select id="favorite-station" required></select></label>
          <button id="favorite-save" type="submit" disabled>儲存快捷鍵</button>
        </form>
      </details>
    </section>

    <details id="service-panel" class="service-panel">
      <summary>官方交通消息 · <span id="service-summary">更新中</span></summary>
      <p>來源：<a href="https://data.gov.hk/en-data/dataset/hk-td-tis_19-special-traffic-news-v2/resource/c177d6fe-658f-4320-9594-a9cb54a3af62">運輸署特別交通消息</a> · <a href="https://tnews.mtr.com.hk/alert/alert_simpletxt_title_tc.html">港鐵官方服務狀況</a></p>
      <p class="service-disclosure">官方資料摘要（規則整理，非 AI）。只根據原文核對收藏路線，不估班次、復修時間或替代路線。</p>
      <div id="service-notices"></div>
    </details>

    <section id="board" class="board">
      <section id="cp-board" class="cp-board"></section>
    </section>
  </div>

  <script src="config.js" defer></script>
  <script src="api.js" defer></script>
  <script src="favorites.js" defer></script>
  <script src="service-news.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
